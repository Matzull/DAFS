[workspace]
resolver = "2"

# Aquí listamos todas las carpetas que has creado con "cargo new"
members = [
    "common",
    "services/master",
    "services/datanode",
    "services/audit",
    "client/fscore",
    "client/cli",
    "client/fuse_daemon",
]

# --- DEPENDENCIAS GLOBALES ---
# Definimos las versiones aquí una sola vez.
# Luego en los hijos solo pondremos: tonic = { workspace = true }
[workspace.dependencies]
# Async Runtime
tokio = { version = "1.52.3", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
    "net",
    "signal",
] }
tokio-stream = "0.1.18"

# gRPC & Protobuf
tonic = "0.14.6"
prost = "0.14.4"
tonic-build = "0.14.6"

# Logs y Trazabilidad (Indispensable para auditoría)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Serialización y Errores
serde = { version = "1.0.228", features = ["derive"] }
bytes = "1.11.1"       # Para manejar los chunks de archivos eficientemente

# Testing
tempfile = "3.27.0"
tokio-test = "0.4.5"
rand = "0.10.1"
config-rs = "0.1.3"
figment = { version = "0.10.19", features = ["toml", "env"] }
chrono = { version = "0.4.45", features = ["serde"] }
crc32fast = "1.5.0"
jsonwebtoken = "10.4.0"
argon2 = "0.5.3"
rusqlite = { version = "0.40.1", features = ["bundled"] }

[profile.release]
# Optimizacion orientada a produccion para servicios de larga vida.
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
