[workspace]
resolver = "2"

# Aquí listamos todas las carpetas que has creado con "cargo new"
members = [
    "common",
    "services/master",
    "services/datanode",
    "services/audit",
    "client/fscore",
    "client/cli",
    "client/fuse_daemon",
    "client/preload_shim",
]

# --- DEPENDENCIAS GLOBALES ---
# Definimos las versiones aquí una sola vez.
# Luego en los hijos solo pondremos: tonic = { workspace = true }
[workspace.dependencies]
# Async Runtime
tokio = { version = "1.36", features = ["full"] }
tokio-stream = "0.1"

# gRPC & Protobuf
tonic = "0.11"
prost = "0.12"
tonic-build = "0.11"

# Logs y Trazabilidad (Indispensable para auditoría)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialización y Errores
serde = { version = "1.0", features = ["derive"] }
bytes = "1.5"       # Para manejar los chunks de archivos eficientemente

# Testing
tempfile = "3.10"
tokio-test = "0.4"
rand = "0.8"
config-rs = "0.1.3"
figment = { version = "0.10.19", features = ["toml", "env"] }
chrono = { version = "0.4.43", features = ["serde"] }
crc32fast = "1.5.0"
jsonwebtoken = "9.3"
argon2 = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
