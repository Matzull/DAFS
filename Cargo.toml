[workspace]
resolver = "2"

# Aquí listamos todas las carpetas que has creado con "cargo new"
members = [
    "common",
    "services/master",
    "services/datanode",
    "services/audit",
    "client/fscore",
    "client/cli",
    "client/fuse_daemon",
]

# --- DEPENDENCIAS GLOBALES ---
# Definimos las versiones aquí una sola vez.
# Luego en los hijos solo pondremos: tonic = { workspace = true }
[workspace.dependencies]
# Async Runtime
tokio = { version = "1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "fs",
    "io-util",
    "net",
    "signal",
] }
tokio-stream = "0.1.19"

# gRPC & Protobuf
tonic = "0.14.7"
tonic-prost = "0.14.7"
prost = "0.14.4"
tonic-build = "0.14.7"
tonic-prost-build = "0.14.7"

# Logs y Trazabilidad (Indispensable para auditoría)
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Serialización y Errores
serde = { version = "1.0.229", features = ["derive"] }
bytes = "1.12.1"       # Para manejar los chunks de archivos eficientemente

# Testing
tempfile = "3.27.0"
tokio-test = "0.4.6"
rand = "0.10.3"
config-rs = "0.1.3"
figment = { version = "0.10.19", features = ["toml", "env"] }
chrono = { version = "0.4.45", features = ["serde"] }
crc32fast = "1.5.3"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
argon2 = "0.6.0"
rusqlite = { version = "0.41.0", features = ["bundled"] }

[profile.release]
# Optimizacion orientada a produccion para servicios de larga vida.
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
