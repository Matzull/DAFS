services:
  # Base de datos de Logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: dfs-elastic
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Limita la RAM para que no se coma tu PC
    ports:
      - "9200:9200"

  # Dashboard Visual
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: dfs-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
  
  init-es:
    image: alpine:latest
    command: >
      sh -c "apk add curl && 
      curl -X PUT 'elasticsearch:9200/_index_template/dfs_audit_template' -H 'Content-Type: application/json' -d '@template.json'"
    volumes:
      - ./template.json:/template.json
    depends_on:
      - elasticsearch