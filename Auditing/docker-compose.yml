networks:
  default:
    external: true
    name: elastic

services:
  setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    volumes:
      - ./certs:/usr/share/elasticsearch/config/certs
      - ./grafana/storage:/var/lib/grafana
    user: "0"
    command: >
      bash -c '
        if [ x${ELASTIC_PASSWORD} == x ]; then
          echo "Set the ELASTIC_PASSWORD environment variable in the .env file";
          exit 1;
        elif [ x${KIBANA_PASSWORD} == x ]; then
          echo "Set the KIBANA_PASSWORD environment variable in the .env file";
          exit 1;
        fi;
        if [ ! -f config/certs/ca.zip ]; then
          echo "Creating CA";
          bin/elasticsearch-certutil ca --silent --pem -out config/certs/ca.zip;
          unzip config/certs/ca.zip -d config/certs;
        fi;
        if [ ! -f config/certs/certs.zip ]; then
          echo "Creating certs";
          echo -ne \
          "instances:\n"\
          "  - name: es01\n"\
          "    dns:\n"\
          "      - es01\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          "  - name: kibana\n"\
          "    dns:\n"\
          "      - kibana\n"\
          "      - localhost\n"\
          "    ip:\n"\
          "      - 127.0.0.1\n"\
          > config/certs/instances.yml;
          bin/elasticsearch-certutil cert --silent --pem -out config/certs/certs.zip --in config/certs/instances.yml --ca-cert config/certs/ca/ca.crt --ca-key config/certs/ca/ca.key;
          unzip config/certs/certs.zip -d config/certs;
        fi;
        echo "Setting file permissions"
        chown -R 472:472 /var/lib/grafana;
        chown -R root:root config/certs;
        find . -type d -exec chmod 750 \{\} \;;
        find . -type f -exec chmod 640 \{\} \;;
        echo "Skipping Elasticsearch API bootstrap in setup (handled after stack is up)";
        echo "All done!";
      '
    healthcheck:
      test: ["CMD-SHELL", "[ -f config/certs/es01/es01.crt ]"]
      interval: 1s
      timeout: 5s
      retries: 120

  es01:
    depends_on:
      setup:
        condition: service_completed_successfully
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION}
    labels:
      co.elastic.logs/module: elasticsearch
    volumes:
      - ./certs:/usr/share/elasticsearch/config/certs:ro
      - ./esdata01:/usr/share/elasticsearch/data
    ports:
      - ${ES_PORT}:9200
    environment:
      - node.name=es01
      - cluster.name=${CLUSTER_NAME}
      - discovery.type=single-node
      - ES_JAVA_OPTS=${ES_JAVA_OPTS:--Xms384m -Xmx384m}
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
      - xpack.ml.enabled=${ES_XPACK_ML_ENABLED:-false}
      - bootstrap.memory_lock=true
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=true
      - xpack.security.http.ssl.key=certs/es01/es01.key
      - xpack.security.http.ssl.certificate=certs/es01/es01.crt
      - xpack.security.http.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.enabled=true
      - xpack.security.transport.ssl.key=certs/es01/es01.key
      - xpack.security.transport.ssl.certificate=certs/es01/es01.crt
      - xpack.security.transport.ssl.certificate_authorities=certs/ca/ca.crt
      - xpack.security.transport.ssl.verification_mode=certificate
      - xpack.license.self_generated.type=${LICENSE}
    mem_limit: ${ES_MEM_LIMIT}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -s --cacert config/certs/ca/ca.crt https://localhost:9200 | grep -q 'missing authentication credentials'",
        ]
      interval: 10s
      timeout: 10s
      retries: 120

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    # Run as root: the image ships /usr/share/grafana/data/plugins-bundled owned
    # by 1000:1000, so the default grafana user (472) can't update the bundled
    # elasticsearch datasource plugin there. That failed update leaves the
    # datasource unregistered ("Could not find plugin definition"), so audit
    # dashboards show no data. Running as root lets the bundled plugin update
    # succeed. (Local single-host deployment; acceptable trade-off.)
    user: "0:0"
    entrypoint:
      - sh
      - -euc
      - |
        # Read the CA certificate and set it as an environment variable
        export GF_ES_CA_CERT=$$(cat /etc/grafana/certs/ca/ca.crt)
        # Execute the normal Grafana startup
        exec /run.sh
    volumes:
      - ./grafana/storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/plugin:/var/lib/grafana/plugins/dafs-ai-assistant-panel
      - ./certs:/etc/grafana/certs:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=${GRAFANA_ANONYMOUS_ENABLED}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=${GRAFANA_ANONYMOUS_ORG_ROLE}
      - GF_AUTH_BASIC_ENABLED=${GRAFANA_BASIC_AUTH_ENABLED}
      - GF_AUTH_DISABLE_LOGIN_FORM=${GRAFANA_DISABLE_LOGIN_FORM}
      - GF_ES_PASSWORD=${ELASTIC_PASSWORD} 
      - GF_ES_USER=${ELASTIC_USER}
      - GF_ES_URL=${ES_URL}:${ES_PORT}
      - GF_PLUGINS_PREINSTALL=grafana-llm-app
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-llm-app,dafs-ai-assistant-panel
      - GF_APP_MODE=production
    depends_on:
     es01:
       condition: service_healthy

  ai-assistant-backend:
    build:
      context: ./grafana/plugin/backend
    container_name: ai-assistant-backend
    env_file:
      - ./.env
      - ./grafana/plugin/backend/.env
    environment:
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-gpt-4.1-mini}
      - LOG_LEVEL=DEBUG
      - ES_VERIFY_TLS=${ES_VERIFY_TLS:-false}
      - ES_CA_CERT_PATH=${ES_CA_CERT_PATH:-}
    ports:
      - "8008:8008"
    volumes:
      - ./certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  grafana-storage: