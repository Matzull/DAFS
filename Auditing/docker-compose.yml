services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.2
    container_name: elasticsearch
    environment:
      - node.name=elasticsearch
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD}
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - elk

  kibana:
    image: docker.elastic.co/kibana/kibana:9.0.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=${ELASTIC_USER}
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD}
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elk
  
  init-es:
    image: alpine:latest
    command: >
      sh -c "apk add curl && 
      echo 'Waiting for Elasticsearch...' &&
      sleep 2 &&
      while ! curl -s http://elasticsearch:9200/_cluster/health | grep -q '\"status\":\"green\"'; do
        sleep 2;
      done &&
      echo 'Elasticsearch is up! Sending template...' &&
      curl -X PUT 'elasticsearch:9200/_index_template/dfs_audit_template' -H 'Content-Type: application/json' -d '@template.json'"
    volumes:
      - ./template.json:/template.json
    depends_on:
      - elasticsearch

volumes:
  esdata:

networks:
  elk: