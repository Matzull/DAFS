version: '3'
services:
  # Base de datos de Logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: dfs-elastic
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Limita la RAM para que no se coma tu PC
    ports:
      - "9200:9200"

  # Dashboard Visual
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: dfs-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch