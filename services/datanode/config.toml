# DAFS DataNode Configuration File

# Server listen address
listen_address = "[::1]:8080"

# Data folder location for storing blocks
data_folder = "./testing/datanode"

# Logging level (trace, debug, info, warn, error)
log_level = "info"

# MPSC channel size for read/write operations
mpsc_channel_size = 64

# Buffer size for reading blocks (in bytes)
# Larger chunks => fewer gRPC messages per block on the read path.
read_buffer_size = 262144

# Buffer size for writing blocks (in bytes)
# Matches the client upload chunk size so each chunk is one buffered write.
write_buffer_size = 1048576

# Write sync policy: all | data | none
write_sync_policy = "data"

# Minimum interval between sync operations for the same block (ms). 0 = always.
# Set to 0 for benchmark fairness: ensure every block is durably written before
# the client's fsync() returns. Higher values batch syncs but delay durability confirmation.
write_sync_interval_ms = 0

metadata_node_address = "http://[::1]:9090"
metadata_node_endpoints = ["http://[::1]:9090", "http://[::1]:9091", "http://[::1]:9092"]

# Replication worker settings
replication_max_parallel_blocks = 16

# Heartbeat behavior
heartbeat_retry_initial_ms = 500
heartbeat_retry_max_ms = 30000
heartbeat_interval_ms = 3000
heartbeat_nack_retry_ms = 1000
heartbeat_cpu_usage = 1.0
heartbeat_free_space = 4
heartbeat_used_space = 4

# Authentication
jwt_secret = "change-me-master-secret"
service_token_exp_seconds = 300
