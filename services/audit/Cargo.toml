[package]
name = "audit"
version = "0.1.0"
edition = "2021"

[dependencies]
# Importamos nuestro código común
common = { path = "../../common" }

# Servidor gRPC
tonic = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }

# Para hablar con Elasticsearch (HTTP JSON)
reqwest = { version = "0.11", features = ["json"] }
serde = { workspace = true }
serde_json = "1.0"

# Logs
tracing = { workspace = true }
tracing-subscriber = { workspace = true }