# DAFS Master (MetadataNode) Configuration File

# Server listen address
listen_address = "[::1]:9090"

# Block size (in bytes) - should match datanode settings
block_size = 1000000

# Replication factor - minimum number of nodes that must contain a block
replication_factor = 2

# Logging level (trace, debug, info, warn, error)
log_level = "info"

# Audit service gRPC address
audit_service_addr = "http://[::1]:9090"

# WAL persistence settings
wal_path = "services/master/master.wal"
wal_batch_size = 128
wal_flush_interval_ms = 250

# Environment
env_file_path = "services/master/.env"

# Internal channel capacities
garbage_collector_channel_size = 1000
block_replicator_channel_size = 1000
audit_channel_size = 10000
wal_channel_size = 20000

# Replication worker parallelism
replication_max_parallel_sources = 8

# Metadata defaults
file_default_owner = "SYSTEM"
audit_default_user = "system"

# Elasticsearch TLS behavior
elastic_allow_invalid_certs = true

# Authentication
auth_db_path = "services/master/users.db"
jwt_secret = "change-me-master-secret"
jwt_exp_seconds = 3600
service_token_exp_seconds = 300
