---
- name: Deploy DAFS with Docker Compose stacks
  hosts: all
  gather_facts: false
  vars:
    dafs_repo_root: /home/matzul/Documents/DAFS
    dafs_network_name: dafs-net
    dafs_build_images: false
    enable_auditing: true
    enable_masters: true
    enable_datanodes: true
    enable_logrotate: true
    logrotate_config_path: /etc/logrotate.d/dafs-docker-json
    logrotate_temp_path: /tmp/dafs-docker-json.logrotate
    logrotate_sudo_password: ""
    logrotate_rotate_count: 14
    logrotate_max_size: 100M

    # Master stack (define one or many)
    master_compose_file: docker-compose.master.yml
    master_env_path: ../services/master/.env
    master_rust_log: info
    master_cluster_members: []
    masters:
      []

    # Datanode stacks (define one or many)
    datanode_compose_file: docker-compose.datanode.yml
    datanodes:
      []

    # Auditing stack
    auditing_compose_file: docker-compose.yml
    auditing_compose_project: dafs-auditing
    auditing_network_name: elastic

  tasks:
    - name: Validate logrotate sudo password is provided
      ansible.builtin.fail:
        msg: >-
          enable_logrotate=true requires logrotate_sudo_password.
          Provide it with cluster_manager (--become-pass) or via
          -e '{"logrotate_sudo_password":"..."}'.
      when:
        - enable_logrotate | bool
        - (logrotate_sudo_password | default('') | length) == 0

    - name: Ensure logrotate package is installed
      ansible.builtin.shell: |
        set -euo pipefail
        if command -v logrotate >/dev/null 2>&1; then
          echo "already-installed"
          exit 0
        fi

        install_cmd=""
        if command -v apt-get >/dev/null 2>&1; then
          install_cmd="apt-get update && apt-get install -y logrotate"
        elif command -v dnf >/dev/null 2>&1; then
          install_cmd="dnf install -y logrotate"
        elif command -v yum >/dev/null 2>&1; then
          install_cmd="yum install -y logrotate"
        elif command -v pacman >/dev/null 2>&1; then
          install_cmd="pacman -Sy --noconfirm logrotate"
        elif command -v zypper >/dev/null 2>&1; then
          install_cmd="zypper --non-interactive install logrotate"
        elif command -v apk >/dev/null 2>&1; then
          install_cmd="apk add --no-cache logrotate"
        else
          echo "unsupported-package-manager"
          exit 1
        fi

        printf '%s\n' "$LOGROTATE_SUDO_PASSWORD" | sudo -S -p '' sh -c "$install_cmd"
        echo "installed"
      args:
        executable: /bin/bash
      environment:
        LOGROTATE_SUDO_PASSWORD: "{{ logrotate_sudo_password }}"
      register: logrotate_install
      changed_when: "'installed' in logrotate_install.stdout"
      when: enable_logrotate | bool

    - name: Render logrotate policy in temp path
      ansible.builtin.copy:
        dest: "{{ logrotate_temp_path }}"
        mode: "0644"
        content: |
          /var/lib/docker/containers/*/*-json.log {
              size {{ logrotate_max_size }}
              rotate {{ logrotate_rotate_count }}
              missingok
              notifempty
              compress
              compresscmd /bin/bzip2
              uncompresscmd /bin/bunzip2
              compressext .bz2
              dateext
              dateformat -%Y-%m-%d-%s
              delaycompress
              copytruncate
              maxsize {{ logrotate_max_size }}
          }
      when:
        - enable_logrotate | bool

    - name: Install logrotate policy with sudo when changed
      ansible.builtin.shell: |
        set -euo pipefail
        if printf '%s\n' "$LOGROTATE_SUDO_PASSWORD" | sudo -S -p '' test -f "{{ logrotate_config_path }}" && \
           printf '%s\n' "$LOGROTATE_SUDO_PASSWORD" | sudo -S -p '' cmp -s "{{ logrotate_temp_path }}" "{{ logrotate_config_path }}"; then
          echo "unchanged"
          exit 0
        fi

        printf '%s\n' "$LOGROTATE_SUDO_PASSWORD" | sudo -S -p '' install -m 0644 "{{ logrotate_temp_path }}" "{{ logrotate_config_path }}"
        echo "updated"
      args:
        executable: /bin/bash
      environment:
        LOGROTATE_SUDO_PASSWORD: "{{ logrotate_sudo_password }}"
      register: logrotate_policy
      changed_when: "'updated' in logrotate_policy.stdout"
      when:
        - enable_logrotate | bool

    - name: Force-run logrotate policy once
      ansible.builtin.shell: |
        set -euo pipefail
        printf '%s\n' "$LOGROTATE_SUDO_PASSWORD" | sudo -S -p '' logrotate -f "{{ logrotate_config_path }}"
      args:
        executable: /bin/bash
      environment:
        LOGROTATE_SUDO_PASSWORD: "{{ logrotate_sudo_password }}"
      changed_when: false
      when:
        - enable_logrotate | bool

    - name: Ensure auditing network exists
      community.docker.docker_network:
        name: "{{ auditing_network_name }}"
        state: present
      when: enable_auditing | bool

    - name: Ensure Elasticsearch data directory has correct ownership (uid 1000)
      become: true
      ansible.builtin.file:
        path: "{{ dafs_repo_root }}/Auditing/esdata01"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      when: enable_auditing | bool

    - name: Start auditing stack (idempotent)
      community.docker.docker_compose_v2:
        project_src: "{{ dafs_repo_root }}/Auditing"
        project_name: "{{ auditing_compose_project }}"
        files:
          - "{{ auditing_compose_file }}"
        state: present
        build: "{{ 'always' if (dafs_build_images | bool) else 'never' }}"
      when: enable_auditing | bool

    - name: Build computed masters metadata endpoints
      ansible.builtin.set_fact:
        masters_metadata_endpoints: >-
          {%- set endpoints = [] -%}
          {%- for m in master_cluster_members -%}
          {%- set _ = endpoints.append('http://' ~ (m.metadata_host | default(m.container_name)) ~ ':' ~ (m.service_port | string)) -%}
          {%- endfor -%}
          {{- endpoints | join(',') -}}
      when:
        - master_cluster_members | length > 0

    - name: Build preferred metadata leader endpoint
      ansible.builtin.set_fact:
        preferred_metadata_leader_endpoint: "http://{{ master_cluster_members[0].metadata_host | default(master_cluster_members[0].container_name) }}:{{ master_cluster_members[0].service_port }}"
      when:
        - master_cluster_members | length > 0

    - name: Ensure shared DAFS network exists
      community.docker.docker_network:
        name: "{{ dafs_network_name }}"
        state: present
      when:
        - enable_masters | bool or enable_datanodes | bool

    - name: Start master stacks (idempotent)
      community.docker.docker_compose_v2:
        project_src: "{{ dafs_repo_root }}/deployment"
        project_name: "{{ item.compose_project }}"
        files:
          - "{{ master_compose_file }}"
        state: present
        build: "{{ 'always' if (dafs_build_images | bool) else 'never' }}"
      environment:
        DAFS_NETWORK_NAME: "{{ dafs_network_name }}"
        ELASTIC_NETWORK_NAME: "{{ auditing_network_name }}"
        MASTER_CONTAINER_NAME: "{{ item.container_name }}"
        MASTER_CONFIG_PATH: "{{ item.config_path }}"
        MASTER_HOST_PORT: "{{ item.host_port | string }}"
        MASTER_SERVICE_PORT: "{{ item.service_port | string }}"
        MASTER_LISTEN_ADDRESS: "{{ item.listen_address }}"
        MASTER_RAFT_BOOTSTRAP: "{{ item.raft_bootstrap | lower }}"
        MASTER_RAFT_NODE_ID: "{{ item.node_id | string }}"
        MASTER_RAFT_INITIAL_MEMBERS: >-
          {%- set peers = [] -%}
          {%- for m in master_cluster_members -%}
          {%- if m.node_id != item.node_id -%}
          {%- set _ = peers.append((m.node_id | string) ~ '=' ~ (m.raft_host | default(m.container_name)) ~ ':' ~ (m.service_port | string)) -%}
          {%- endif -%}
          {%- endfor -%}
          {{- peers | join(',') -}}
        MASTER_WAL_PATH: "{{ item.wal_path }}"
        MASTER_AUTH_DB_PATH: "{{ item.auth_db_path }}"
        MASTER_ENV_PATH: "{{ master_env_path }}"
        MASTER_RUST_LOG: "{{ master_rust_log }}"
      loop: "{{ masters }}"
      when:
        - enable_masters | bool
        - masters | length > 0

    - name: Start datanode stacks (idempotent)
      community.docker.docker_compose_v2:
        project_src: "{{ dafs_repo_root }}/deployment"
        project_name: "{{ item.compose_project }}"
        files:
          - "{{ datanode_compose_file }}"
        state: present
        build: "{{ 'always' if (dafs_build_images | bool) else 'never' }}"
      environment:
        DAFS_NETWORK_NAME: "{{ dafs_network_name }}"
        DATANODE_CONFIG_PATH: "{{ item.config_path }}"
        DATANODE_HOST_PORT: "{{ item.host_port }}"
        DATANODE_CONTAINER_NAME: "{{ item.container_name }}"
        DATANODE_RUST_LOG: "{{ item.rust_log | default('info') }}"
        DATANODE_LISTEN_ADDRESS: "{{ item.listen_address | default('[::]:8080') }}"
        DATANODE_METADATA_ADDRESS: "{{ item.metadata_address | default(preferred_metadata_leader_endpoint | default('')) }}"
        DATANODE_METADATA_ENDPOINTS: "{{ item.metadata_endpoints | default(masters_metadata_endpoints | default('')) }}"
      loop: "{{ datanodes }}"
      when:
        - enable_datanodes | bool
        - datanodes | length > 0
